name: tests

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  tests:
    runs-on: windows-latest          # the program is Windows only (Win32 calls, Windows OCR)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m pytest
